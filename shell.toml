# Omarchy shell overrides for the Hermes visual system.
[bar]
background = "#09091A"
background-alpha = 0.96
text = "#F5F5F5"
active = "#EDFF45"
scale-with-font = true
size-horizontal = 28
size-vertical = 30

[hyprland]
active-border = "#0000F2 #5B6CFF #EDFF45 45deg"
active-border-foreground = "#5B6CFF #EDFF45 45deg"

[controls]
normal-color = "#D9D9E5"
normal-fill-alpha = 0.04
normal-border = "#33335A"
normal-border-alpha = 1.0
hover-cursor-color = "#F5F5F5"
hover-cursor-fill-alpha = 0.10
hover-cursor-border = "#5B6CFF"
focus-color = "#FFFFFF"
focus-fill-alpha = 0.12
focus-border = "hyprland.active-border"
focus-border-width = 2
selected-color = "#09091A"
selected-fill-alpha = 1.0
selected-border = "#EDFF45"
selected-border-width = 1
pressed-fill-alpha = 0.22
selection-fill-alpha = 0.35

[font]
base-size = 12

[popups]
background = "#0E0E23"
background-alpha = 0.98
text = "#F5F5F5"
border = "hyprland.active-border"
border-alpha = 1.0

[tooltip]
background = "#15152E"
background-alpha = 0.98
text = "#F5F5F5"
border = "#5B6CFF"
border-alpha = 1.0

[notifications]
background = "#0E0E23"
background-alpha = 0.98
text = "#F5F5F5"
border = "hyprland.active-border"
border-alpha = 1.0
countdown = "#EDFF45"

[launcher]
background = "#0E0E23"
background-alpha = 0.98
text = "#F5F5F5"
border = "hyprland.active-border-foreground"
border-alpha = 1.0
scrim = "#050510"
scrim-alpha = 0.68
selected-background = "#EDFF45"
selected-background-alpha = 1.0
selected-text = "#09091A"
selected-border = "#EDFF45"
selected-border-alpha = 1.0
selected-border-width = 1

[menu]
background = "#0E0E23"
background-alpha = 0.99
text = "#F5F5F5"
border = "hyprland.active-border-foreground"
border-alpha = 1.0
scrim = "#050510"
scrim-alpha = 0.68
selected-background = "#EDFF45"
selected-background-alpha = 1.0
selected-text = "#09091A"
selected-border = "#EDFF45"
selected-border-alpha = 1.0
selected-border-width = 1

[polkit]
background = "#0E0E23"
background-alpha = 0.99
text = "#F5F5F5"
text-error = "#FF5C6C"
border = "hyprland.active-border"
border-error = "#FF5C6C"
border-alpha = 1.0
scrim = "#050510"
scrim-alpha = 0.72
accent = "#EDFF45"

[lock]
background = "#0E0E23"
background-alpha = 0.94
text = "#F5F5F5"
placeholder = "#8C8CA7"
text-error = "#FF5C6C"
border = "#5B6CFF"
border-active = "hyprland.active-border"
border-error = "#FF5C6C"
border-alpha = 1.0
selection = "#EDFF45"
selection-alpha = 0.45

[image-picker]
scrim = "#050510"
scrim-alpha = 0.72
text = "#F5F5F5"
selected-border = "#EDFF45"
selected-border-alpha = 1.0
unselected-border = "#5B6CFF"
unselected-border-alpha = 0.4
